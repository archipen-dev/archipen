# Build both Docker images, check that they run like Kubernetes "restricted" would (scripts/docker-smoke.sh),
# scan them for known vulnerabilities (Grype), and publish them to GitHub Container Registry with an SBOM and a
# signed build provenance attestation (verify with `gh attestation verify oci://<image> -R archipen-dev/archipen`):
#   ghcr.io/archipen-dev/archipen          the app (Dockerfile)
#   ghcr.io/archipen-dev/archipen-render   the export server (render/Dockerfile)
# Tags: edge on main; X.Y.Z, X.Y and latest for releases; sha-<short> on both. Pull requests build and test only.
# Version tags don't trigger this workflow directly: release.yml calls it once its checks have passed, so a release
# that fails verification never publishes images.
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    # Pull requests only build and test; the push steps are skipped for them.
    permissions:
      contents: read
      packages: write
      id-token: write # signing the provenance attestation (Sigstore)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: archipen
            dockerfile: Dockerfile
            smoke: ''
          - name: archipen-render
            dockerfile: render/Dockerfile
            smoke: --render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Test the amd64 build on the runner before anything is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.name }}:smoke
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - run: scripts/docker-smoke.sh ${{ matrix.name }}:smoke ${{ matrix.smoke }}
      # Fail on high or critical vulnerabilities that already have a fix (a base image or dependency bump).
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.name }}:smoke
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max
      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
